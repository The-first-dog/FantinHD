<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Voxel Type Fantin HD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : scène WebGL plein écran, interface posée dans les coins comme un viseur, réglages repliables en haut à droite */
:root{
  --ink:#000000;
  --fg:#f1efe9;
  --mute:#9b988f;
  --line:rgba(241,239,233,.13);
  --line-strong:rgba(241,239,233,.46);
  --panel:rgba(7,7,7,.9);
  --hot:#fa4ff5;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --top:calc(14px + env(safe-area-inset-top, 0px));
  --bot:calc(14px + env(safe-area-inset-bottom, 0px));
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);overflow:hidden}
body{font-family:var(--mono);font-size:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.frame{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));border:1px solid var(--line);pointer-events:none}
.ui{position:fixed;letter-spacing:.2em;text-transform:uppercase;font-size:11px;font-weight:500}
.brand{top:var(--top);left:var(--gut);padding:6px 10px}
.stats-l{bottom:var(--bot);left:var(--gut);padding:6px 10px}
.stats-r{bottom:var(--bot);right:var(--gut-r);padding:6px 10px;text-align:right;line-height:1.6}
.ctl{top:var(--top);right:var(--gut-r);width:min(300px, calc(100vw - 48px));display:flex;flex-direction:column;gap:8px;text-transform:none;letter-spacing:0}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quick button{all:unset;box-sizing:border-box;text-align:center;padding:11px 8px;border:1px solid var(--line-strong);background:rgba(0,0,0,.55);font:500 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;color:var(--fg);min-height:38px}
.quick button:hover{background:rgba(241,239,233,.1)}
.quick button.primary{background:var(--fg);color:#000}
.quick button.primary:hover{background:#fff}
#ctlBtn{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1px solid var(--line-strong);background:rgba(0,0,0,.55);font:500 11px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;color:var(--fg)}
#ctlBtn:hover{background:rgba(241,239,233,.08)}
#ctlBtn:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
#panel{border:1px solid var(--line-strong);background:var(--panel);backdrop-filter:blur(10px);max-height:calc(100vh - 190px);overflow:auto;padding:4px 14px 14px;scrollbar-width:thin}
.sec{border-top:1px solid var(--line);padding:12px 0 4px}
.sec:first-child{border-top:0}
.sec h3{margin:0 0 10px;font:500 10px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--mute)}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 40px;align-items:center;gap:8px;margin:0 0 9px}
.row label{font-size:11px;color:var(--fg)}
.row output{font-size:10px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.row.wide{grid-template-columns:96px minmax(0,1fr)}
input[type=range]{width:100%;accent-color:var(--fg);height:18px;margin:0}
select{width:100%;background:#000;color:var(--fg);border:1px solid var(--line-strong);font:400 11px var(--mono);padding:6px 6px;border-radius:0}
input[type=checkbox]{accent-color:var(--fg);width:15px;height:15px;margin:0;justify-self:start}
.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:0 0 10px}
.swatches input{width:100%;height:28px;padding:0;border:1px solid var(--line-strong);background:none;border-radius:0;cursor:pointer}
.swatches input::-webkit-color-swatch-wrapper{padding:0}
.swatches input::-webkit-color-swatch{border:0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.btns button{all:unset;box-sizing:border-box;flex:1 1 auto;text-align:center;padding:9px 8px;border:1px solid var(--line-strong);font:500 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--fg);min-height:34px}
.btns button:hover{background:rgba(241,239,233,.1)}
.btns button.primary{background:var(--fg);color:#000}
.btns button.primary:hover{background:#fff}
.note{font-size:10.5px;line-height:1.5;color:var(--mute);margin:0 0 10px}
.bottom{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 6px);width:min(480px, calc(100vw - 230px))}
#txt{box-sizing:border-box;width:100%;background:rgba(0,0,0,.55);border:1px solid var(--line-strong);color:var(--fg);font:500 14px/1 var(--mono);letter-spacing:.24em;text-align:center;padding:14px 12px;border-radius:0}
#txt::placeholder{color:var(--mute)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 70px);background:var(--fg);color:#000;padding:8px 12px;font:500 11px var(--mono);letter-spacing:.08em;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 48px);text-align:center}
#toast.on{opacity:1}
.rec{color:var(--hot)}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute);font-size:12px;line-height:1.6}
@media (max-width:640px){
  .bottom{width:calc(100vw - 48px);bottom:calc(var(--bot) + 44px)}
  .stats-r{line-height:1.4}
  #panel{max-height:calc(100vh - 230px)}
  .brand{max-width:45vw}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
body.is-white{background:#fff}
body.is-white .brand,body.is-white .stats-l,body.is-white .stats-r{color:#111}
body.is-white .frame{border-color:rgba(0,0,0,.14)}
body.is-white #ctlBtn,body.is-white #txt,body.is-white .quick button:not(.primary){background:rgba(255,255,255,.75);color:#111;border-color:rgba(0,0,0,.4)}
body.is-recording #gl{object-fit:contain;background:#000;cursor:default}
body.is-recording.is-white #gl{background:#fff}
</style>

<canvas id="gl" aria-label="Texte en pixels de verre, en 3D. Glisser pour tourner, molette pour zoomer, clic sur un pixel pour changer sa couleur."></canvas>
<div class="frame" aria-hidden="true"></div>
<div class="ui brand">Fantin HD · Voxel Type</div>

<div class="ui ctl">
  <div class="quick"><button id="flatBtn" type="button" title="Remet le texte de face">À plat</button><button id="pngBtn" type="button" class="primary" title="Exporte une image PNG avec les réglages d'export">PNG ↓</button></div>
  <button id="ctlBtn" type="button" aria-expanded="false" aria-controls="panel"><span>Réglages</span><span id="ctlSign" aria-hidden="true">+</span></button>
  <div id="panel" hidden></div>
</div>

<div class="bottom">
  <label for="txt" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Texte</label>
  <input id="txt" type="text" maxlength="40" autocomplete="off" spellcheck="false" value="Fantin HD" placeholder="Tape ton texte (| pour aller à la ligne)">
</div>

<div class="ui stats-l" id="statV">Voxels · 0</div>
<div class="ui stats-r"><div id="statF">FPS · 0</div><div id="statC">Caractères · 0</div></div>
<div id="toast" role="status" aria-live="polite"></div>

  fantinhd:["#FDCB0B","#FF7A10","#F6033A","#FA4FF5","#7E1AFC","#2A0BF5"],
  vitrail:["#FFC83D","#FF7B1C","#FF2F45","#FF5EC9","#8B53FF","#2E46FF"],
  glace:["#E8FBFF","#9BE7FF","#38C6FF","#2A8BFF","#3D4DFF","#8A7CFF"],
  braise:["#FFE08A","#FFB13B","#FF7A1A","#FF3B1F","#D9103A","#8C0A3C"],
  blanc:["#FFFFFF","#F3F1EA","#E2E0D8","#CFCBC0","#BDB8AC","#A7A296"],
  // Le vide (2:00:00) : blanc pur, blanc cassé, blanc lait, crème, coquille d'œuf, lin
  vide:["#FFFFFF","#FAF9F6","#FDFBF4","#FFF6E5","#F2EEE3","#E9E3D6"]
};

const DEFAULTS = {
  text:"Fantin HD", preset:"fantinhd", palette:PRESETS.fantinhd.slice(), mode:"gradient", tone:"color", seed:7, kern:true,
  gap:0.1, depth:1.6, opacity:1, border:0.13, bright:2,
  rays:true, rayLen:12.3, rayInt:0.44, rayDir:237, rayTilt:0, rayWidth:0.76, raySpread:2.35, rayFall:1.87,
  bloom:0.16, bloomRadius:0.04, bloomThr:0, grain:0, exposure:1.43,
  view:"flat", lockRot:true, autoZoom:"off", zoomMargin:0.08, sway:true, speed:1.7,
  fmt:"screen", res:"2160", bg:"transparent", overrides:{}, cam:null, scene:"logo",
  vidBg:"black", vidFmt:"wide", vidRes:"1080", vidFps:"60", vidHold:2, vidFade:true, sound:true, volume:0.6, timbre:"verre"
};
/* Modèles : réglages de départ pour le logo, les images d'annonce (16:9) et les affiches de jeu (2:3).
   Chaque modèle part des réglages du logo officiel et ne change que ce qui est listé. */
const PAL = { braise:PRESETS.braise, glace:PRESETS.glace, vitrail:PRESETS.vitrail, fantinhd:PRESETS.fantinhd, vide:PRESETS.vide };
const ANNONCE = { mode:"logo", sway:false, lockRot:true, view:"flat", autoZoom:"global", zoomMargin:0.6, fmt:"wide", res:"1600", bg:"black" };
const AFFICHE = { mode:"logo", sway:false, lockRot:true, view:"flat", autoZoom:"global", zoomMargin:0.3, rayLen:11, rayDir:250, fmt:"poster", res:"1800", bg:"black" };
const SCENES = {
  logo:{ nom:"Logo Fantin HD", s:{} },
  logoBlanc:{ nom:"Logo blanc sans rayons (en-tête)", s:{ rays:false, tone:"white", autoZoom:"letters", zoomMargin:0.05, fmt:"banner", res:"2400", bg:"transparent", sway:false } },
  annonceStudio:{ nom:"Annonce — Fantin HD", s:Object.assign({}, ANNONCE, { text:"Fantin HD", mode:"gradient", zoomMargin:0.3 }) },
  annonceFarkle:{ nom:"Annonce — Farkle", s:Object.assign({}, ANNONCE, { text:"Farkle", preset:"braise", palette:PAL.braise.slice(), zoomMargin:0.75 }) },
  annonceClean:{ nom:"Annonce — Clean Glass", s:Object.assign({}, ANNONCE, { text:"Clean Glass", preset:"glace", palette:PAL.glace.slice() }) },
  annonce3200000:{ nom:"Annonce — 3 200 000", s:Object.assign({}, ANNONCE, { text:"3 200 000", preset:"vitrail", palette:PAL.vitrail.slice(), mode:"gradient" }) },
  annonce2h:{ nom:"Annonce — 2:00:00", s:Object.assign({}, ANNONCE, { text:"2:00:00", preset:"vide", palette:PAL.vide.slice(), zoomMargin:0.75 }) },
  annonceVierge:{ nom:"Annonce — texte libre", s:Object.assign({}, ANNONCE, { text:"Nouveau", zoomMargin:0.6 }) },
  afficheFarkle:{ nom:"Affiche — Farkle", s:Object.assign({}, AFFICHE, { text:"Farkle", preset:"braise", palette:PAL.braise.slice() }) },
  afficheClean:{ nom:"Affiche — Clean Glass", s:Object.assign({}, AFFICHE, { text:"Clean|Glass", preset:"glace", palette:PAL.glace.slice() }) },
  affiche3200000:{ nom:"Affiche — 3 200 000 (3.2M)", s:Object.assign({}, AFFICHE, { text:"3.2M", preset:"vitrail", palette:PAL.vitrail.slice(), mode:"gradient" }) },
  affiche2h:{ nom:"Affiche — 2:00:00", s:Object.assign({}, AFFICHE, { text:"2:00:00", preset:"vide", palette:PAL.vide.slice() }) },
  introJeu:{ nom:"Intro de jeu — Fantin HD (vidéo)", s:{ text:"Fantin HD", mode:"gradient", sway:false, lockRot:true, view:"flat", autoZoom:"letters", zoomMargin:0.35, vidFmt:"wide", vidRes:"1080", vidHold:2, vidFade:true, sound:true } }
};
const KEY = "fantinhd-voxel-type-v1";
let S = structuredClone(DEFAULTS);

let camReady = false;
const persist = () => { try { if (camReady) S.cam = camState(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Rendu ---------- */
const canvas = document.getElementById("gl");
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:true });
} catch (e) {
  document.getElementById("err").hidden = false;
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.setClearColor(0x000000, 1);
renderer.toneMapping = THREE.ReinhardToneMapping;

const scene = new THREE.Scene();
const perspCam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 500);
// Vue plate : caméra orthographique, aucun point de fuite (les rayons restent parallèles)
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 500);
let camera = S.view === "flat" ? orthoCam : perspCam;
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
const group = new THREE.Group();
scene.add(group);

const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), S.bloom, S.bloomRadius, S.bloomThr);
composer.addPass(bloom);
const grainPass = new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, uTime:{value:0}, uGrain:{value:S.grain} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uTime, uGrain; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){ vec4 c=texture2D(tDiffuse,vUv); vec2 d=vUv-.5; c.rgb*=1.-.55*dot(d,d);
      c.rgb+=(h(vUv*vec2(1733.,977.)+uTime)-.5)*uGrain*(.15+c.rgb); gl_FragColor=c; }`
});
composer.addPass(grainPass);
composer.addPass(new OutputPass());
// Fond de la vidéo : la lumière posée sur du blanc (blanc = 1 − luminosité + couleur), et fondu de fin
const bgPass = new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, uWhite:{value:0}, uFade:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uWhite, uFade; varying vec2 vUv;
    void main(){ vec3 c=texture2D(tDiffuse,vUv).rgb*(1.-uFade); float a=max(c.r,max(c.g,c.b));

let voxMesh = null, rayMesh = null, cells = [], layoutW = 0, layoutCY = 3, charX = [], charBorn = [], prevChars = [];

function hash(a, b, c, d){
  let h = (a * 374761393 + b * 668265263 + c * 2147483647 + d * 1274126177) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;

function colsOf(gl, col){ const rows = []; gl.forEach((r, i) => { if (r[col] === "#") rows.push(i); }); return rows; }
function canKern(prev, next){
  const a = colsOf(prev, prev[0].length - 1), b = colsOf(next, 0);
  return a.length && b.length && !a.some(r => b.some(q => Math.abs(r - q) <= 1));

// « | » passe à la ligne : chaque ligne est centrée, 2 rangées d'écart entre les lignes
function layout(text){
  const chars = [...text.normalize("NFD").replace(/[\u0300-\u036f]/g, "")];
  const out = []; const xs = []; let x = 0, prev = null, line = 0, lineStart = 0;
  const widths = [];
  chars.forEach((ch, i) => {
    if (ch === "|"){ widths[line] = x; line++; x = 0; prev = null; xs[i] = 0; return; }
    const gl = G[ch] || G[ch.toUpperCase()];
    if (!gl){ xs[i] = x; x += 3; prev = null; return; }
    if (prev){ x += (S.kern && canKern(prev, gl)) ? 0 : 1; }
    xs[i] = x;
    const w = gl[0].length;
    gl.forEach((row, r) => { for (let c = 0; c < w; c++) if (row[c] === "#") out.push({ i, r, c, x:x + c, gw:w, line, ry:r + line * 9 }); });
    x += w; prev = gl;
  });
  widths[line] = x;
  const width = Math.max(...widths);
  for (const cell of out) cell.x += (width - widths[cell.line]) / 2;
  return { cells:out, width, rows:(line + 1) * 9 - 2, chars, xs };
}

const pal = () => S.palette.map(h => new THREE.Color(h));
function mixPal(P, t){

function rawColorOf(cell, P){

  const rnd = hash(S.seed, cell.i, cell.r, cell.c);
  if (S.mode === "random") return P[Math.floor(rnd * P.length)].clone();
  if (S.mode === "gradient") return mixPal(P, cell.x / Math.max(1, layoutW - 1) * (P.length - 1) + (rnd - .5) * .5);

function rayDirVec(){

function updateMatrices(){
  if (!voxMesh) return;

  const idQ = new THREE.Quaternion();
  cells.forEach((cell, k) => {

    voxMesh.setMatrixAt(k, tmpM.compose(tmpV, idQ, tmpS.set(s, s, S.depth)));
    rayMesh.setMatrixAt(k, tmpM.compose(tmpV, tmpQ, tmpS.set(1, 1, 1)));

function updateColors(){

function updateBorn(){

function rebuild(){

  const t = now();

  prevChars = L.chars;
  if (voxMesh){ group.remove(voxMesh, rayMesh); voxMesh.geometry.dispose(); rayMesh.geometry.dispose(); voxMesh.dispose(); rayMesh.dispose(); }

/* ---------- Caméra ---------- */
let fitBase = 1;
function fitDist(aspect){
  const W = Math.max(layoutW, 6) + 3, H = layoutCY * 2 + 5;
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max((W / 2) / (tv * aspect), (H / 2) / tv) * 1.12;
}
function fitHalfH(aspect){
  const W = Math.max(layoutW, 6) + 3, H = layoutCY * 2 + 5;
  return Math.max(H / 2, (W / 2) / aspect) * 1.12;
}
function setOrtho(aspect){

}
function frame(){
  const ty = -1.6;

}
function setView(v){
  const dir = camera.position.clone().sub(controls.target).normalize();

  const dist = v === "flat" ? 60 : fitDist(perspCam.aspect);
  camera.position.copy(controls.target).add(dir.multiplyScalar(dist));
  controls.object = camera;
  renderPass.camera = camera;
  setOrtho(perspCam.aspect);
  controls.update();
}
// Zoom automatique : cadre les lettres seules, ou les lettres et leurs rayons
let boundsDirty = true, bounds = { letters:[], global:[] };
function computeBounds(){
  const L = [], R = [], s = 1 - S.gap, hz = S.depth / 2, D = rayDirVec();
  const rnd = voxMesh ? voxMesh.geometry.getAttribute("aRand") : null;
  cells.forEach((cell, k) => {
    const x = cell.x - (layoutW - 1) / 2, y = layoutCY - cell.ry;
    for (const dx of [-s / 2, s / 2]) for (const dy of [-s / 2, s / 2]) for (const dz of [-hz, hz]) L.push(new THREE.Vector3(x + dx, y + dy, dz));
    if (S.rays && S.rayInt > 0){
      // au-delà de 75 % de sa longueur, un rayon est presque invisible : on ne le cadre pas
      const len = S.rayLen * (.72 + .56 * (rnd ? rnd.getX(k) : .5)) * .75;
      const w = s * S.rayWidth * (1 + (S.raySpread - 1) * .75) / 2;
      const e = new THREE.Vector3(x, y, 0).addScaledVector(D, len);
      for (const dx of [-w, w]) for (const dy of [-w, w]) R.push(new THREE.Vector3(e.x + dx, e.y + dy, e.z));

  boundsDirty = false;
}
function autoFit(snap){
  if (S.autoZoom === "off" || !cells.length) return;
  if (boundsDirty) computeBounds();
  const pts = S.autoZoom === "global" ? bounds.global : bounds.letters;
  camera.updateMatrixWorld();
  const r = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
  const u = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
  const f = camera.position.clone().sub(controls.target).normalize();
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of pts){ const a = p.dot(r), b = p.dot(u); if (a < x0) x0 = a; if (a > x1) x1 = a; if (b < y0) y0 = b; if (b > y1) y1 = b; }
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, m = 1 + S.zoomMargin;
  const t = controls.target;
  const goal = t.clone().addScaledVector(r, cx - t.dot(r)).addScaledVector(u, cy - t.dot(u));
  const k = snap ? 1 : .18;
  if (camera === orthoCam){
    const z = Math.min(orthoCam.top / Math.max(.01, (y1 - y0) / 2 * m), orthoCam.right / Math.max(.01, (x1 - x0) / 2 * m));
    const d = camera.position.distanceTo(t);

function applyZoomMode(){

}
function camState(){

}
function applyCam(c){

  controls.target.fromArray(c.target);
  if (Array.isArray(c.persp)) perspCam.position.fromArray(c.persp);
  if (Array.isArray(c.ortho)) orthoCam.position.fromArray(c.ortho);

// « À plat » : la caméra revient de face en douceur, le texte arrête de se balancer
let flatAnim = null;
function flatten(){
  if (S.sway){ S.sway = false; const cb = document.getElementById("c-sway"); if (cb) cb.checked = false; persist(); }
  const from = camera.position.clone().sub(controls.target);

function stepFlat(){

/* ---------- Son : chaque cube joue sa note en apparaissant ----------
   Hauteur selon la rangée (en haut = aigu), accord qui change à chaque lettre, gamme pentatonique
   (toutes les notes s'accordent entre elles), position stéréo selon la place du cube. */
let actx = null, master = null, recDest = null;
function audio(){
  if (actx) return actx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  actx = new AC();
  master = actx.createGain(); master.gain.value = S.volume;
  const comp = actx.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
  // petite réverbération : échos filtrés qui s'éteignent
  const wet = actx.createGain(); wet.gain.value = .3;
  const delay = actx.createDelay(1); delay.delayTime.value = .17;
  const fb = actx.createGain(); fb.gain.value = .35;
  const lp = actx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3000;
  master.connect(comp); master.connect(wet); wet.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(comp);
  comp.connect(actx.destination);
  recDest = actx.createMediaStreamDestination(); comp.connect(recDest);
  return actx;
}
const SCALE = [0, 2, 4, 7, 9], CHORD = [0, 2, 4, 1, 3];
const TIMBRES = {
  verre:{ type:"sine", parts:[[1, 1, 1.5], [2.76, .32, .7], [5.4, .1, .35]] },
  cloche:{ type:"sine", parts:[[1, 1, 2.2], [2, .45, 1.3], [3, .2, .8], [4.2, .12, .5]] },
  harpe:{ type:"triangle", parts:[[1, 1, 1.1], [2, .25, .55]] }
};
function noteOf(cell){
  const step = (6 - Math.min(cell.r, 8)) + CHORD[cell.i % CHORD.length];
  const semis = SCALE[step % 5] + 12 * Math.floor(step / 5);
  return 261.63 * Math.pow(2, semis / 12);
}
function chime(time, freq, pan, gain){
  const T = TIMBRES[S.timbre] || TIMBRES.verre;
  const out = actx.createGain(); out.gain.value = gain;
  let node = out;
  if (actx.createStereoPanner){ const p = actx.createStereoPanner(); p.pan.value = pan; out.connect(p); node = p; }
  node.connect(master);
  let end = time;
  for (const [ratio, amp, decay] of T.parts){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = T.type; o.frequency.value = freq * ratio * (1 + (Math.random() - .5) * .004);
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(amp, time + .005);
    g.gain.exponentialRampToValueAtTime(.0001, time + decay);
    o.connect(g); g.connect(out);
    o.start(time); o.stop(time + decay + .05);
    end = Math.max(end, time + decay + .1);
  }
  setTimeout(() => { try { node.disconnect(); } catch (e) {} }, (end - actx.currentTime) * 1000 + 200);
}
function playBirths(fromTime){
  if (!S.sound || !actx || actx.state !== "running" || !voxMesh) return;
  const born = voxMesh.geometry.getAttribute("aBorn"), t0 = now(), base = actx.currentTime;
  const cols = new Map();
  cells.forEach((cell, k) => {
    const b = born.getX(k);
    if (b < fromTime) return;
    const key = b.toFixed(3);
    if (!cols.has(key)) cols.set(key, []);
    cols.get(key).push(cell);
  });
  for (const [b, list] of cols){
    const when = base + Math.max(0, +b - t0);
    const gain = .2 / Math.sqrt(list.length);
    for (const cell of list) chime(when, noteOf(cell), Math.max(-.7, Math.min(.7, (cell.x / Math.max(1, layoutW - 1)) * 1.4 - .7)), gain);
  }
}
async function listen(){
  const c = audio();
  if (c){ try { await c.resume(); } catch (e) {} }
  replay(.3);
}

/* ---------- Boucle ---------- */
let frames = 0, lastF = performance.now();
function loop(){
  requestAnimationFrame(loop);
  const t = now();
  voxMat.uniforms.uTime.value = rayMat.uniforms.uTime.value = t;
  grainPass.uniforms.uTime.value = t % 10;
  if (fadeStart !== null){ bgPass.uniforms.uFade.value = Math.min(1, Math.max(0, (t - fadeStart) / .7)); bgPass.enabled = true; }
  if (S.sway && !reduced){ group.rotation.y = Math.sin(t * .4) * .28; group.rotation.x = Math.sin(t * .27) * .07; }
  else { group.rotation.y *= .88; group.rotation.x *= .88; }
  stepFlat();
  controls.update();
  autoFit(false);
  composer.render();
  frames++;
  const p = performance.now();
  if (p - lastF > 500){ document.getElementById("statF").textContent = "FPS · " + Math.round(frames * 1000 / (p - lastF)); frames = 0; lastF = p; }
}

/* ---------- Clic sur un pixel : couleur suivante de la palette ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
canvas.addEventListener("pointerdown", e => { down = { x:e.clientX, y:e.clientY, t:performance.now() }; });
canvas.addEventListener("pointerup", e => {
  if (!down || !voxMesh) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
  down = null;
  if (moved > 5 || dt > 400) return;
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(voxMesh)[0];
  if (!hit || hit.instanceId === undefined) return;
  const cell = cells[hit.instanceId];
  const key = cell.i + ":" + cell.r + ":" + cell.c;
  const cur = S.overrides[key];
  S.overrides[key] = cur === undefined ? 0 : (cur + 1) % S.palette.length;
  updateColors(); persist();
});

let dlPromise = null;
async function saveFile(name, blob){
  try {
    if (window.claude && window.claude.use){
      dlPromise = dlPromise || window.claude.use("downloads");
      const dl = await dlPromise;
      if (dl){ await dl.save({ filename:name, data:blob }); toast("Fichier enregistré : " + name); return; }
    }
  } catch (e) {
    if (e && e.code === "declined"){ toast("Enregistrement annulé"); return; }
    if (e && e.code === "rate_limited"){ toast("Une demande est déjà ouverte"); return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Fichier enregistré : " + name);
}

function exportSize(){
  const L = +S.res;
  const asp = { screen:innerWidth / innerHeight, square:1, wide:16 / 9, banner:3, poster:2 / 3 }[S.fmt];
  return asp >= 1 ? [L, Math.round(L / asp)] : [Math.round(L * asp), L];
}

function renderAt(w, h){
  const pr = renderer.getPixelRatio(), oldAsp = perspCam.aspect;
  const saved = { t:controls.target.clone(), pp:perspCam.position.clone(), op:orthoCam.position.clone(), z:orthoCam.zoom };
  const dir = perspCam.position.clone().sub(controls.target);
  const k = dir.length() / fitDist(oldAsp);
  renderer.setPixelRatio(1); renderer.setSize(w, h, false);
  composer.setPixelRatio(1); composer.setSize(w, h);
  perspCam.aspect = w / h; perspCam.updateProjectionMatrix();
  perspCam.position.copy(controls.target).add(dir.setLength(fitDist(w / h) * k));
  setOrtho(w / h);
  autoFit(true);
  const keepBg = bgPass.enabled; bgPass.enabled = false;
  const keepGrain = grainPass.uniforms.uGrain.value;
  if (S.bg !== "black") grainPass.uniforms.uGrain.value = 0;
  composer.render();
  const out = document.createElement("canvas"); out.width = w; out.height = h;
  const ctx = out.getContext("2d"); ctx.drawImage(renderer.domElement, 0, 0, w, h);
  grainPass.uniforms.uGrain.value = keepGrain;
  bgPass.enabled = keepBg;
  perspCam.position.copy(controls.target).add(dir.setLength(dir.length() / fitDist(w / h) * fitDist(oldAsp)));
  renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight, false);
  composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
  perspCam.aspect = oldAsp; perspCam.updateProjectionMatrix();
  setOrtho(oldAsp);
  controls.target.copy(saved.t); perspCam.position.copy(saved.pp); orthoCam.position.copy(saved.op);
  orthoCam.zoom = saved.z; orthoCam.updateProjectionMatrix();
  if (S.bg === "black"){
    // Grain très fin (± 1,5 niveau) sur tout ce qui n'est pas noir pur : supprime les paliers des dégradés sombres
    const img = ctx.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4){
      if (d[i] + d[i + 1] + d[i + 2] === 0) continue;
      const n = (Math.random() - .5) * 3;
      d[i] = Math.min(255, Math.max(0, Math.round(d[i] + n))); d[i + 1] = Math.min(255, Math.max(0, Math.round(d[i + 1] + n))); d[i + 2] = Math.min(255, Math.max(0, Math.round(d[i + 2] + n)));
    }
    ctx.putImageData(img, 0, 0);
  }
  if (S.bg !== "black"){
    // Lumière sur fond noir → alpha = luminosité, comme un calque en mode « addition »
    const img = ctx.getImageData(0, 0, w, h), d = img.data;
    for (let i = 0; i < d.length; i += 4){
      const a = Math.max(d[i], d[i + 1], d[i + 2]);
      if (a === 0){ if (S.bg === "white"){ d[i] = d[i + 1] = d[i + 2] = d[i + 3] = 255; } else d[i + 3] = 0; continue; }
      if (S.bg === "ink"){ d[i] = d[i + 1] = d[i + 2] = 0; d[i + 3] = a; continue; }
      if (S.bg === "white"){ d[i] = d[i + 1] = d[i + 2] = 255 - a; d[i + 3] = 255; continue; }
      const f = 255 / a; d[i] = Math.min(255, d[i] * f); d[i + 1] = Math.min(255, d[i + 1] * f); d[i + 2] = Math.min(255, d[i + 2] * f); d[i + 3] = a;
    }
    ctx.putImageData(img, 0, 0);
  }
  return out;
}

const slug = () => (S.text.trim() || "voxel").replace(/[^\w-]+/g, "-").toLowerCase();
async function exportPNG(){
  const [w, h] = exportSize();
  toast("Rendu " + w + " × " + h + "…");
  await new Promise(r => setTimeout(r, 30));
  const c = renderAt(w, h);
  c.toBlob(b => b ? saveFile(slug() + "-" + w + "x" + h + ({ black:"", transparent:"-transparent", ink:"-noir-transparent", white:"-noir-sur-blanc" }[S.bg] || "") + ".png", b) : toast("Image trop grande pour ce navigateur, baisse la taille"), "image/png");
}

let recording = false;
function videoSize(){
  const L = +S.vidRes;   // plus petit côté
  const asp = { screen:innerWidth / innerHeight, wide:16 / 9, vertical:9 / 16, square:1 }[S.vidFmt] || 16 / 9;
  const even = n => Math.round(n / 2) * 2;
  return asp >= 1 ? [even(L * asp), L] : [L, even(L / asp)];
}
async function exportVideo(){
  if (recording) return;
  if (!window.MediaRecorder || !canvas.captureStream){ toast("Ce navigateur ne sait pas enregistrer de vidéo (essaie Chrome ou Edge)"); return; }
  // MP4 seulement en H.264 + AAC (lu partout : Unity, Godot, Unreal, montage) ; sinon WebM
  const types = ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1.4d0028,mp4a.40.2", "video/mp4;codecs=avc1,mp4a.40.2", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  const mime = types.find(m => MediaRecorder.isTypeSupported(m));
  if (!mime){ toast("Aucun format vidéo disponible dans ce navigateur"); return; }
  const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
  const [w, h] = videoSize(), fps = +S.vidFps;

  // la scène passe à la taille exacte de la vidéo pendant l'enregistrement
  const pr = renderer.getPixelRatio(), oldAsp = perspCam.aspect;
  const saved = { t:controls.target.clone(), pp:perspCam.position.clone(), op:orthoCam.position.clone(), z:orthoCam.zoom };
  const dir = perspCam.position.clone().sub(controls.target), k = dir.length() / fitDist(oldAsp);
  recording = true;
  renderer.setPixelRatio(1); renderer.setSize(w, h, false);
  composer.setPixelRatio(1); composer.setSize(w, h);
  perspCam.aspect = w / h; perspCam.updateProjectionMatrix();
  perspCam.position.copy(controls.target).add(dir.setLength(fitDist(w / h) * k));
  setOrtho(w / h); autoFit(true);
  document.body.classList.add("is-recording");

  const tracks = [...canvas.captureStream(fps).getVideoTracks()];
  if (S.sound && audio()){ try { await actx.resume(); } catch (e) {} if (actx.state === "running") tracks.push(...recDest.stream.getAudioTracks()); }
  const rec = new MediaRecorder(new MediaStream(tracks), { mimeType:mime, videoBitsPerSecond:w * h > 2.5e6 ? 40e6 : 20e6, audioBitsPerSecond:192000 });
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    recording = false; fadeStart = null; bgPass.uniforms.uFade.value = 0; applyBg();
    renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight, false);
    composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight);
    perspCam.aspect = oldAsp; perspCam.updateProjectionMatrix(); setOrtho(oldAsp);
    controls.target.copy(saved.t); perspCam.position.copy(saved.pp); orthoCam.position.copy(saved.op);
    orthoCam.zoom = saved.z; orthoCam.updateProjectionMatrix();
    document.body.classList.remove("is-recording");
    document.getElementById("statV").classList.remove("rec");
    document.getElementById("statV").textContent = "Voxels · " + cells.length;
    saveFile(slug() + "-intro-" + w + "x" + h + "-fond-" + (S.vidBg === "white" ? "blanc" : "noir") + "." + ext, new Blob(chunks, { type:mime.split(";")[0] }));
  };
  document.getElementById("statV").classList.add("rec");
  document.getElementById("statV").textContent = "● REC " + w + "×" + h;
  const lead = .6, reveal = ((layoutW + 6) * .03 + .55 * 2.4) / S.speed;
  replay(lead);                         // écran vide d'abord, puis apparition de gauche à droite
  rec.start();
  const fadeAt = lead + reveal + S.vidHold;
  if (S.vidFade) fadeStart = now() + fadeAt;
  setTimeout(() => rec.stop(), (fadeAt + (S.vidFade ? .8 : 0) + .25) * 1000);
}

function exportFavicon(){
  const first = cells.length ? cells[0].i : -1;
  const own = cells.map((c, k) => [c, k]).filter(([c]) => c.i === first);
  if (!own.length){ toast("Tape au moins une lettre"); return; }
  const P = pal();
  const w = own[0][0].gw, rows = Math.max(7, ...own.map(([c]) => c.r + 1));
  const size = Math.max(w, rows) + 2, ox = (size - w) / 2, oy = (size - rows) / 2;
  const rects = own.map(([c]) => '<rect x="' + (ox + c.c) + '" y="' + (oy + c.r) + '" width="1" height="1" fill="#' + colorOf(c, P).getHexString() + '"/>').join("");
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges"><rect width="' + size + '" height="' + size + '" rx="' + (size * .18) + '" fill="#0b0b0b"/>' + rects + "</svg>";
  saveFile("favicon.svg", new Blob([svg], { type:"image/svg+xml" }));
}

function exportSettings(){
  S.cam = camState();

function applySettings(obj){
  if (!obj || typeof obj !== "object") throw new Error("format");
  const next = structuredClone(DEFAULTS);
  for (const k of Object.keys(DEFAULTS)) if (k in obj && typeof obj[k] === typeof DEFAULTS[k] || (k in obj && DEFAULTS[k] === null)) next[k] = obj[k];
  if (!Array.isArray(next.palette) || next.palette.length !== 6 || !next.palette.every(h => /^#[0-9a-f]{6}$/i.test(h))) next.palette = PRESETS.fantinhd.slice();
  if (!next.overrides || typeof next.overrides !== "object") next.overrides = {};
  S = next;
  txt.value = S.text;
  buildPanel(); applyUniforms(); rebuild();
  camera = S.view === "flat" ? orthoCam : perspCam;
  controls.object = camera; renderPass.camera = camera;
  frame(); applyCam(S.cam);
  controls.enableRotate = !S.lockRot;
  applyZoomMode(); applyBg(); persist();
}

const panel = document.getElementById("panel");
function fmtVal(v, s){ return s >= 1 ? String(Math.round(v)) : (+v).toFixed(s < .01 ? 3 : 2); }
function onChange(item){
  persist();
  if (item.f === "geo") updateMatrices();
  if (item.f === "text") rebuild();
  if (item.f === "born") updateBorn();
  if (item.f === "lock") controls.enableRotate = !S.lockRot;
  if (item.f === "vol" && master) master.gain.value = S.volume;
  applyUniforms();
}
function buildPanel(){
  panel.replaceChildren();
  for (const [title, items] of UI){
    const sec = document.createElement("div"); sec.className = "sec";
    const h = document.createElement("h3"); h.textContent = title; sec.append(h);
    for (const it of items){
      if (it.t === "note"){ const p = document.createElement("p"); p.className = "note"; p.textContent = it.x; sec.append(p); continue; }
      if (it.t === "btns"){
        const d = document.createElement("div"); d.className = "btns";
        for (const [lab, fn, primary] of it.b){ const b = document.createElement("button"); b.type = "button"; b.textContent = lab; if (primary) b.className = "primary"; b.addEventListener("click", fn); d.append(b); }
        sec.append(d); continue;
      }
      if (it.t === "palette"){
        const d = document.createElement("div"); d.className = "swatches";
        S.palette.forEach((hex, i) => {
          const inp = document.createElement("input"); inp.type = "color"; inp.value = hex.toLowerCase(); inp.id = "sw" + i;
          inp.setAttribute("aria-label", "Couleur " + (i + 1));
          inp.addEventListener("input", () => { S.palette[i] = inp.value; S.preset = "perso"; const sel = document.getElementById("c-preset"); if (sel) sel.value = "perso"; updateColors(); persist(); });
          d.append(inp);
        });
        sec.append(d); continue;
      }
      const row = document.createElement("div"); row.className = "row";
      const lab = document.createElement("label"); lab.textContent = it.l; lab.htmlFor = "c-" + it.k; row.append(lab);
      if (it.t === "select"){
        row.classList.add("wide");
        const sel = document.createElement("select"); sel.id = "c-" + it.k;
        for (const [v, t] of it.o){ const o = document.createElement("option"); o.value = v; o.textContent = t; sel.append(o); }
        sel.value = S[it.k];
        sel.addEventListener("change", () => {
          S[it.k] = sel.value;
          if (it.k === "preset" && PRESETS[sel.value]){ S.palette = PRESETS[sel.value].slice(); S.palette.forEach((hx, i) => { const sw = document.getElementById("sw" + i); if (sw) sw.value = hx.toLowerCase(); }); }
          if (it.k === "preset" || it.k === "mode" || it.k === "tone") updateColors();
          if (it.k === "autoZoom") applyZoomMode();
          if (it.k === "vidBg") applyBg();
          if (it.k === "scene" && SCENES[sel.value]){ applySettings(Object.assign(structuredClone(DEFAULTS), SCENES[sel.value].s, { scene:sel.value })); toast("Modèle chargé : " + SCENES[sel.value].nom); }
          if (it.k === "view") setView(sel.value);
          persist();
        });
        row.append(sel);
      } else if (it.t === "check"){
        row.classList.add("wide");
        const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "c-" + it.k; cb.checked = !!S[it.k];
        cb.addEventListener("change", () => { S[it.k] = cb.checked; onChange(it); });
        row.append(cb);
      } else {
        const rg = document.createElement("input"); rg.type = "range"; rg.id = "c-" + it.k; rg.min = it.min; rg.max = it.max; rg.step = it.s; rg.value = S[it.k];
        const out = document.createElement("output"); out.htmlFor = rg.id; out.textContent = fmtVal(S[it.k], it.s);
        rg.addEventListener("input", () => { S[it.k] = +rg.value; out.textContent = fmtVal(S[it.k], it.s); onChange(it); });
        row.append(rg, out);
      }
      sec.append(row);
    }
    panel.append(sec);
  }
}

document.getElementById("flatBtn").addEventListener("click", flatten);
document.getElementById("pngBtn").addEventListener("click", exportPNG);
const ctlBtn = document.getElementById("ctlBtn");
ctlBtn.addEventListener("click", () => {
  const open = panel.hidden;
  panel.hidden = !open;
  ctlBtn.setAttribute("aria-expanded", String(open));
  document.getElementById("ctlSign").textContent = open ? "−" : "+";
});

const txt = document.getElementById("txt");
txt.value = S.text;
txt.addEventListener("input", () => {
  const before = layoutW;
  const typedAt = now() - .01;
  S.text = txt.value; persist(); rebuild();
  playBirths(typedAt);
  if (layoutW !== before){
    setOrtho(perspCam.aspect);
    const d = fitDist(perspCam.aspect);
    if (d > perspCam.position.distanceTo(controls.target) * 1.05 || layoutW < before){ const dir = perspCam.position.clone().sub(controls.target).setLength(d); perspCam.position.copy(controls.target).add(dir); }
  }
});

buildPanel();
applyUniforms();
rebuild();
frame();
applyCam(S.cam);
controls.enableRotate = !S.lockRot;
applyZoomMode();
controls.addEventListener("end", persist);
camReady = true;
applyBg();
if (!reduced) replay();
loop();
</script>
</body></html>
