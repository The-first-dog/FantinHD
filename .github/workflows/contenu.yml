# NE PAS TOUCHER — reconstruit « contenu/contenu (ne pas toucher).js » dès qu'une annonce, un lien, un jeu ou un texte change dans contenu/.
# En cas d'erreur (date mal écrite, image absente…), l'étape « Construire » échoue avec un message
# en français et le site garde son contenu précédent.
name: Mettre à jour le contenu du site

on:
  push:
    branches: [main]
    paths:
      - "contenu/**"
      - "!contenu/contenu (ne pas toucher).js"
      - "outils/construire-contenu (ne pas toucher).mjs"
      - "styles (ne pas toucher).css"
      - "app (ne pas toucher).js"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: contenu
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Construire
        run: node "outils/construire-contenu (ne pas toucher).mjs"
      - name: Enregistrer sur main
        id: enregistrer
        run: |
          if git diff --quiet -- "contenu/contenu (ne pas toucher).js" index.html; then
            echo "Le contenu est déjà à jour."
            echo "change=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "contenu/contenu (ne pas toucher).js" index.html
          git commit -m "Mettre à jour le contenu du site"
          git push
          echo "change=oui" >> "$GITHUB_OUTPUT"
      - name: Relancer la publication du site
        if: steps.enregistrer.outputs.change == 'oui'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
